<style>

:center;gap:7px;min-height:44px;padding:8px 14px;border:1px solid transparent;border-radius:9px;font-weight:700;scale:1;transition-property:scale,background-color,border-color,color;transition-duration:120ms}.button:active{scale:.96}.button:focus-visible,.sheet-close:focus-visible,.adjust-summary:focus-visible,.dialog-close:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.button-primary{background:var(--blue);color:#fff}.button-primary:hover{background:#124d84}.button-secondary{border-color:#8a96a1;background:#fff;color:var(--blue-dark)}.button-secondary:hover{background:#edf3f8}.sheet-actions .button{flex:1}.prompt-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px max(20px,calc((100vw - 1280px)/2));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(24 48 72/.06)}.adjust-summary{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:transparent;text-align:left;padding:4px;border-radius:8px}.summary-icon{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue-dark)}.summary-copy{display:block;min-width:0}.summary-title{display:block;font-size:.86rem;font-weight:750;color:var(--blue-dark)}.summary-value{display:block;max-width:54vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.75rem}.prompt-actions{display:flex;gap:8px;flex:none}.copy-button.is-copied{background:var(--success);color:#fff}.copy-button .copy-done,.copy-button.is-copied .copy-ready{display:none}.copy-button.is-copied .copy-done{display:inline}.app-footer{padding:6px max(20px,calc((100vw - 1280px)/2));background:#eef2f5;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem;text-align:center}.backdrop{display:none}.prompt-dialog{width:min(760px,calc(100% - 32px));max-height:min(82dvh,760px);padding:0;border:1px solid #9ba8b5;border-radius:14px;background:#fff;color:var(--ink);box-shadow:var(--shadow)}.prompt-dialog::backdrop{background:rgb(16 28 40/.46)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:1.05rem;margin:0;color:var(--blue-dark)}.dialog-meta{margin-left:auto;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}.dialog-close{display:grid;place-items:center;width:40px;height:40px;border:0;background:transparent}.prompt-dialog #output{width:100%;height:min(56dvh,520px);min-height:320px;border:0;border-radius:0;padding:16px;font-family:ui-monospace,SFMono-Regular,Consolas,Meiryo,monospace;font-size:.86rem;line-height:1.7;resize:none}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:#f8fafb}.status{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.update-notice{position:fixed;z-index:40;right:16px;bottom:62px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 12px;border:1px solid #6e91af;border-radius:10px;background:#fff;box-shadow:var(--shadow);font-size:.86rem}.update-notice p{margin:0}.update-notice button{min-height:40px;padding:7px 12px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700}
@media(max-width:899px){.app-header{align-items:stretch;gap:9px;padding:9px 12px;flex-direction:column}.brand-mark{width:32px;height:32px}.brand h1{font-size:1.12rem}.mode-switch{width:100%;max-width:none}.mode-label{min-height:38px;padding:6px 8px;font-size:.82rem}.workspace{display:block;padding:10px 10px 12px;overflow:auto}.style-section{overflow:visible}.section-head{padding:10px 12px}.section-head p{display:none}.style-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px;overflow:visible}.style-copy{padding:7px 8px 8px}.style-name{font-size:.88rem}.style-desc{display:none}.continue-note{margin:0 9px 9px}.settings-sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:min(88dvh,760px);border-radius:18px 18px 0 0;box-shadow:0 -14px 44px rgb(16 28 40/.22);translate:0 105%;visibility:hidden;transition-property:translate,visibility;transition-duration:220ms}.settings-sheet.is-open{translate:0 0;visibility:visible}.sheet-close{display:grid;place-items:center}.backdrop{position:fixed;z-index:30;inset:0;background:rgb(16 28 40/.42);opacity:0;visibility:hidden;display:block;transition-property:opacity,visibility;transition-duration:180ms}.backdrop.is-open{opacity:1;visibility:visible}.prompt-bar{padding:8px 10px;gap:8px}.summary-icon{width:36px;height:36px}.summary-value{max-width:40vw}.prompt-actions .button{padding-inline:11px}.button-label-wide{display:none}.app-footer{padding:5px 10px}.update-notice{bottom:104px}.prompt-dialog{width:calc(100% - 20px);max-height:88dvh}.prompt-dialog #output{height:58dvh;min-height:260px}}

</head>
<body>
<div class="app-shell">
<header class="app-header"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10L4 20Z"></path><path d="m13.5 7 3.5 3.5"></path></svg></span><h1>手描きプロンプト</h1></div><fieldset class="mode-switch"><legend class="status">作成方法</legend><label class="mode-option"><input type="radio" name="mode" value="new" checked><span class="mode-label">新しく作る</span></label><label class="mode-option"><input type="radio" name="mode" value="continue"><span class="mode-label">同じ雰囲気で続ける</span></label></fieldset></header>
<main class="workspace">
<section class="style-section" id="style-section" aria-labelledby="style-heading"><div class="section-head"><div><h2 id="style-heading">画風を選ぶ</h2><p>同じ静物を6種類の画材で比較できます</p></div><span class="sample-kind">見本：静物</span></div><p class="continue-note" id="series-note" hidden>シリーズ基準画像から画風を引き継ぐため、画風を選ぶ必要はありません。</p><fieldset><legend>画風</legend><div class="style-gallery" id="styles"></div></fieldset></section>
<aside class="settings-sheet" id="settings-sheet" aria-labelledby="settings-heading"><div class="sheet-head"><h2 id="settings-heading">写真に合わせて調整</h2><button class="sheet-close" id="close-settings" type="button" aria-label="調整画面を閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div><div class="settings-scroll">
<div class="form-row"><label class="input-label" for="keep">必ず残すもの<span class="help">例：やかんの形、取っ手、蓋の花柄</span></label><textarea id="keep" placeholder="残したい形や特徴"></textarea></div>
<div class="form-row"><label class="input-label" for="remove">取り除くもの<span class="help">例：青いラベル、背景の値札</span></label><textarea id="remove" placeholder="写真から取り除きたいもの"></textarea></div>
<div class="form-row"><label class="input-label" for="change">今回だけの変更<span class="help">例：花の色を青にする</span></label><textarea id="change" placeholder="追加の変更があれば入力"></textarea></div>
<h3 class="subheading">構図・背景</h3><fieldset><legend>構図・背景の扱い</legend><div class="composition"><label class="choice"><input type="radio" name="composition" value="whole" checked><span class="composition-card"><span><span class="choice-name">写真全体を描く</span><span class="choice-desc">風景・建物・室内向け</span></span></span></label><label class="choice"><input type="radio" name="composition" value="simplify"><span class="composition-card"><span><span class="choice-name">背景を簡略化</span><span class="choice-desc">主役を残して整理</span></span></span></label><label class="choice"><input type="radio" name="composition" value="custom"><span class="composition-card"><span><span class="choice-name">背景を指定</span><span class="choice-desc">白背景などに変更</span></span></span></label></div></fieldset>
<div class="form-row" id="background-row" hidden><label class="input-label" for="background">指定する背景<span class="help">未入力の場合は白背景にします</span></label><textarea id="background" placeholder="例：白い背景"></textarea></div></div><div class="sheet-actions"><button class="button button-secondary" id="reset" type="button">入力を戻す</button><button class="button button-primary" id="apply-settings" type="button">調整を反映</button></div></aside><div class="backdrop" id="settings-backdrop"></div>
</main>
<section class="prompt-bar" aria-label="プロンプト操作"><button class="adjust-summary" id="open-settings" type="button"><span class="summary-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M14 4v6M4 17h2M10 17h10M7 14v6"></path></svg></span><span class="summary-copy"><span class="summary-title">写真に合わせて調整</span><span class="summary-value" id="settings-summary">写真全体を描く・追加指定なし</span></span></button><div class="prompt-actions"><button class="button button-secondary" id="show-prompt" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"></path></svg><span class="button-label-wide">プロンプト表示</span></button><button class="button button-primary copy-button" id="copy" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="copy-ready">コピー</span><span class="copy-done">コピー済み</span></button></div></section>
<footer class="app-footer">API不使用・入力内容は外部へ送信されません</footer></div>
<dialog class="prompt-dialog" id="prompt-dialog"><div class="dialog-head"><h2>作成されたプロンプト</h2><span class="dialog-meta" id="count">0字</span><button class="dialog-close" id="close-prompt" type="button" aria-label="プロンプトを閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div><textarea id="output" readonly aria-label="作成されたプロンプト"></textarea><div class="dialog-actions"><button class="button button-primary copy-button" id="copy-dialog" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="copy-ready">コピー</span><span class="copy-done">コピー済み</span></button></div></dialog>
<p class="status" id="status" role="status" aria-live="polite"></p><aside class="update-notice" id="update-notice" role="status" hidden><p>新しい版を利用できます。</p><button type="button" id="reload-app">再読み込み</button></aside>
<script src="./prompt-config.js"></script>
<script>
const config=window.PROMPT_CONFIG,{text:promptText,styles}=config,positions=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],stylesEl=document.querySelector('#styles');
styles.forEach((s,i)=>{const[col,row]=positions[i],label=document.createElement('label');label.className='style-option';label.innerHTML=`<input type="radio" name="style" value="${s.id}" ${i?'':'checked'}><span class="style-card"><span class="style-image" style="--col:${col};--row:${row}"><img src="./images/style-samples-v1.webp" alt="${s.name}のやかんの見本"></span><span class="style-copy"><span class="style-name">${s.name}</span><span class="style-desc">${s.desc}</span></span></span>`;stylesEl.appendChild(label)});
const fields=['keep','remove','change','background'],val=id=>document.querySelector('#'+id).value.trim(),items=t=>t.split(/\n+/).map(x=>x.trim()).filter(Boolean),section=(title,lines)=>`【${title}】\n`+lines.map(x=>'・'+x).join('\n'),checked=name=>document.querySelector(`input[name="${name}"]:checked`).value;
const promptDialog=document.querySelector('#prompt-dialog'),settingsSheet=document.querySelector('#settings-sheet'),settingsBackdrop=document.querySelector('#settings-backdrop'),mobileQuery=matchMedia('(max-width: 899px)');
function compositionRules(){const type=checked('composition'),rules=promptText.compositions;if(type==='custom'){const custom=rules.custom,background=val('background')?items(val('background')):[custom.defaultBackground];return section(promptText.headings.composition,[custom.before,...background,custom.after])}return section(promptText.headings.composition,rules[type])}
function settingsSummary(){const labels={whole:'写真全体を描く',simplify:'背景を簡略化',custom:val('background')||'白い背景'},count=['keep','remove','change'].filter(id=>val(id)).length;document.querySelector('#settings-summary').textContent=`${labels[checked('composition')]}・${count?`追加指定 ${count}件`:'追加指定なし'}`}
function updateConditionalFields(){const continuing=checked('mode')==='continue',custom=checked('composition')==='custom';document.querySelector('#series-note').hidden=!continuing;document.querySelector('#background-row').hidden=!custom;document.querySelector('#style-section').classList.toggle('is-continuing',continuing);document.querySelectorAll('input[name="style"]').forEach(input=>input.disabled=continuing)}
function render(){const s=styles.find(x=>x.id===checked('style')),continuing=checked('mode')==='continue',h=promptText.headings,parts=[continuing?promptText.intro.continue:promptText.intro.new];if(continuing)parts.push(section(h.series,promptText.series));if(val('keep'))parts.push(section(h.keep,items(val('keep'))));if(val('remove'))parts.push(section(h.remove,items(val('remove'))));if(val('change'))parts.push(section(h.change,items(val('change'))));parts.push(compositionRules());parts.push(section(h.subject,promptText.subject));if(!continuing){parts.push(section(h.color,s.id==='ink-wash'?promptText.colorRules.inkWash:promptText.colorRules.default));const labels=promptText.styleLabels;parts.push(section(h.stylePrefix+s.name,[`${labels.material}：${s.material}`,`${labels.line}：${s.line}`,`${labels.paint}：${s.paint}`,`${labels.color}：${s.color}`,`${labels.texture}：${s.texture}`]));parts.push(section(h.avoid,[...s.avoid,promptText.noAttribution]))}const out=parts.join('\n\n');document.querySelector('#output').value=out;document.querySelector('#count').textContent=out.length+'字';settingsSummary()}
function openSettings(){if(!mobileQuery.matches){settingsSheet.querySelector('textarea')?.focus();return}settingsSheet.classList.add('is-open');settingsBackdrop.classList.add('is-open');settingsSheet.setAttribute('role','dialog');settingsSheet.setAttribute('aria-modal','true');document.querySelector('#close-settings').focus()}
function closeSettings(){settingsSheet.classList.remove('is-open');settingsBackdrop.classList.remove('is-open');settingsSheet.removeAttribute('role');settingsSheet.removeAttribute('aria-modal');document.querySelector('#open-settings').focus()}
function closePrompt(){promptDialog.close();document.querySelector('#show-prompt').focus()}
async function copyPrompt(){const output=document.querySelector('#output');try{await navigator.clipboard.writeText(output.value)}catch(error){output.focus();output.select();document.execCommand('copy');output.setSelectionRange(0,0)}document.querySelectorAll('.copy-button').forEach(b=>b.classList.add('is-copied'));document.querySelector('#status').textContent='プロンプトをコピーしました。';clearTimeout(window.copyTimer);window.copyTimer=setTimeout(()=>{document.querySelectorAll('.copy-button').forEach(b=>b.classList.remove('is-copied'));document.querySelector('#status').textContent=''},1600)}
document.querySelectorAll('input[name="style"]').forEach(x=>x.addEventListener('change',render));document.querySelectorAll('input[name="mode"],input[name="composition"]').forEach(x=>x.addEventListener('change',()=>{updateConditionalFields();render()}));fields.forEach(id=>document.querySelector('#'+id).addEventListener('input',render));
document.querySelector('#open-settings').addEventListener('click',openSettings);document.querySelector('#close-settings').addEventListener('click',closeSettings);settingsBackdrop.addEventListener('click',closeSettings);document.querySelector('#apply-settings').addEventListener('click',()=>{render();if(mobileQuery.matches)closeSettings()});document.querySelector('#show-prompt').addEventListener('click',()=>{promptDialog.showModal();document.querySelector('#output').scrollTop=0});document.querySelector('#close-prompt').addEventListener('click',closePrompt);promptDialog.addEventListener('click',e=>{if(e.target===promptDialog)closePrompt()});document.querySelector('#copy').addEventListener('click',copyPrompt);document.querySelector('#copy-dialog').addEventListener('click',copyPrompt);
document.querySelector('#reset').addEventListener('click',()=>{document.querySelector('input[name="mode"][value="new"]').checked=true;document.querySelector('input[value="colored-pencil"]').checked=true;document.querySelector('input[name="composition"][value="whole"]').checked=true;fields.forEach(id=>document.querySelector('#'+id).value='');updateConditionalFields();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&settingsSheet.classList.contains('is-open')){e.preventDefault();closeSettings()}});mobileQuery.addEventListener('change',e=>{if(!e.matches){settingsSheet.classList.remove('is-open');settingsBackdrop.classList.remove('is-open');settingsSheet.removeAttribute('role');settingsSheet.removeAttribute('aria-modal')}});updateConditionalFields();render();
if('serviceWorker'in navigator){const hadController=Boolean(navigator.serviceWorker.controller);navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)document.querySelector('#update-notice').hidden=false});window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));document.querySelector('#reload-app').addEventListener('click',()=>location.reload())}
</script>
</body></html>
